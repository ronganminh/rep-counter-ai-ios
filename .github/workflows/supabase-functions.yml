name: Supabase Edge Functions

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-functions.yml"

permissions:
  contents: read

jobs:
  deno:
    name: Deno fmt, lint, test (Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/
      - run: deno lint supabase/
      - run: deno test --no-remote supabase/functions/

  sql:
    name: SQL migrations and RLS tests (plain Postgres + Supabase stub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: supabase/tests/run.sh
