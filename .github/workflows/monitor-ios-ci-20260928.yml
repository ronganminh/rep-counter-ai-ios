name: Monitor imported-source iOS CI

on:
  push:
    paths:
      - .github/workflows/monitor-ios-ci-20260928.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STATUS_URL: https://filebin.net/d7f36b24a9154ce9b0387fa6210ed84c/ios-ci-status.txt
      GH_API: https://api.github.com

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for CI run on this commit
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          run_status=''
          conclusion=''
          html_url=''

          for attempt in $(seq 1 150); do
            response="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GH_API/repos/$GITHUB_REPOSITORY/actions/workflows/ios-ci.yml/runs?branch=main&event=push&per_page=30")"

            values="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); sha=sys.argv[1]; matches=[r for r in data.get("workflow_runs",[]) if r.get("head_sha")==sha]; r=matches[0] if matches else {}; print("\t".join(str(r.get(k,"")) for k in ("id","status","conclusion","html_url")))' "$GITHUB_SHA")"
            IFS=$'\t' read -r run_id run_status conclusion html_url <<< "$values"

            if [[ -n "$run_id" && "$run_status" == completed ]]; then
              break
            fi
            sleep 20
          done

          if [[ -z "$run_id" ]]; then
            echo 'No Flutter iOS CI run was found for this commit.' >&2
            exit 1
          fi
          if [[ "$run_status" != completed ]]; then
            echo "CI run $run_id did not complete before the monitor timeout." >&2
            exit 1
          fi

          jobs="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GH_API/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"

          {
            echo "status=COMPLETED"
            echo "conclusion=$conclusion"
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$run_id"
            echo "run_url=$html_url"
            printf '%s' "$jobs" | python3 -c 'import json,sys; data=json.load(sys.stdin); [print(f"job={j.get(chr(110)+chr(97)+chr(109)+chr(101))}|status={j.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))}|conclusion={j.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))}") for j in data.get("jobs",[])]; [print(f"step={j.get(chr(110)+chr(97)+chr(109)+chr(101))}::{s.get(chr(110)+chr(97)+chr(109)+chr(101))}|status={s.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))}|conclusion={s.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))}") for j in data.get("jobs",[]) for s in j.get("steps",[])]'
          } | tee /tmp/ios-ci-status.txt

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H 'Content-Type: text/plain' --data-binary @/tmp/ios-ci-status.txt \
            "$STATUS_URL" >/dev/null

          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Remove temporary monitor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/monitor-ios-ci-20260928.yml
          git commit -m 'chore: remove temporary CI monitor [skip ci]'
          git push

      - name: Fail when CI did not pass
        if: steps.wait.outputs.conclusion != 'success'
        shell: bash
        run: exit 1
