name: E2E SaveStream TikTok photo API

on:
  push:
    branches:
      - chore/savestream-downloader-bridge-test
    paths:
      - .github/workflows/savestream-downloader-bridge-test.yml

permissions:
  contents: read

jobs:
  photo-api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_URL: https://www.tiktok.com/@vnt.1.8/photo/7691561538561346837?is_from_webapp=1&sender_device=pc
      INTERNAL_API_KEY: e2e-key
      TOKEN_SECRET: e2e-token-secret-not-for-production
      REDIS_URL: ""
      PROVIDER_ORDER: cobalt
      ENABLE_YTDLP: "false"
      COBALT_URL: http://127.0.0.1:9000/
      MAX_CAROUSEL_ITEMS: "50"
    steps:
      - name: Clone downloader
        run: git clone --depth=1 https://github.com/ronganminh/savestream-video-downloader.git target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start self-hosted Cobalt
        run: |
          docker run -d --name cobalt -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e API_PORT=9000 \
            -e API_LISTEN_ADDRESS=0.0.0.0 \
            ghcr.io/imputnet/cobalt:11
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cobalt
          exit 1

      - name: Start downloader API
        working-directory: target
        run: |
          nohup uvicorn savestream_downloader.main:app --host 127.0.0.1 --port 8787 \
            > /tmp/downloader-api.log 2>&1 &
          echo $! > /tmp/downloader-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/downloader-api.log
          exit 1

      - name: Resolve exact TikTok photo post
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = "http://127.0.0.1:8787/v1/resolve"
          body = json.dumps({"source":"tiktok","url":os.environ["TEST_URL"]}).encode()
          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type":"application/json",
                  "X-SaveStream-Service-Key":os.environ["INTERNAL_API_KEY"],
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=40) as r:
              data = json.load(r)
          print(json.dumps(data, indent=2))
          assert data["media_type"] == "photo_carousel", data
          assert len(data["items"]) == 3, data
          assert data["download_all_url"], data
          assert all(item["kind"] == "photo" for item in data["items"]), data
          open("/tmp/resolve.json","w").write(json.dumps(data))
          PY

      - name: Download first photo and ZIP through API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open("/tmp/resolve.json"))
          print("item_url="+d["items"][0]["download_url"])
          print("zip_url="+d["download_all_url"])
          open("/tmp/item_url","w").write(d["items"][0]["download_url"])
          open("/tmp/zip_url","w").write(d["download_all_url"])
          PY
          ITEM_URL="$(cat /tmp/item_url)"
          ZIP_URL="$(cat /tmp/zip_url)"
          curl -fsS -D /tmp/item.headers \
            -H "X-SaveStream-Service-Key: $INTERNAL_API_KEY" \
            "http://127.0.0.1:8787$ITEM_URL" -o /tmp/photo.bin
          curl -fsS -D /tmp/zip.headers \
            -H "X-SaveStream-Service-Key: $INTERNAL_API_KEY" \
            "http://127.0.0.1:8787$ZIP_URL" -o /tmp/photos.zip
          echo "=== item headers ==="
          cat /tmp/item.headers
          echo "photo_bytes=$(wc -c < /tmp/photo.bin)"
          file /tmp/photo.bin
          echo "=== zip headers ==="
          cat /tmp/zip.headers
          echo "zip_bytes=$(wc -c < /tmp/photos.zip)"
          unzip -t /tmp/photos.zip
          COUNT="$(unzip -Z1 /tmp/photos.zip | wc -l | tr -d ' ')"
          echo "zip_items=$COUNT"
          test "$COUNT" = "3"

      - name: Show service logs
        if: always()
        run: |
          echo "=== downloader ==="
          cat /tmp/downloader-api.log 2>/dev/null || true
          echo "=== cobalt ==="
          docker logs cobalt 2>&1 || true
