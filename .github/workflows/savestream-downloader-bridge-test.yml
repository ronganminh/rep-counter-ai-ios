name: Publish SaveStream downloader v0.2

on:
  push:
    branches:
      - chore/savestream-downloader-bridge-test
    paths:
      - .github/workflows/savestream-downloader-bridge-test.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4

      - name: Reconstruct downloader source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bridge/savestream-downloader/chunk*.b64 > /tmp/savestream-downloader.b64
          base64 -d /tmp/savestream-downloader.b64 > /tmp/savestream-downloader.zip
          unzip -t /tmp/savestream-downloader.zip
          mkdir -p /tmp/savestream-downloader-src
          unzip -q /tmp/savestream-downloader.zip -d /tmp/savestream-downloader-src
          test -f /tmp/savestream-downloader-src/pyproject.toml
          test -f /tmp/savestream-downloader-src/src/savestream_downloader/main.py
          echo "archive_bytes=$(wc -c < /tmp/savestream-downloader.zip)"
          find /tmp/savestream-downloader-src -maxdepth 3 -type f | sort

      - name: Publish to savestream-video-downloader
        env:
          BRIDGE_TOKEN: ${{ secrets.SAVESTREAM_DOWNLOADER_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_TOKEN:-}" ]; then
            echo "::error::SAVESTREAM_DOWNLOADER_PUSH_TOKEN is missing or empty"
            exit 1
          fi

          auth="$(printf 'x-access-token:%s' "$BRIDGE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth"             clone https://github.com/ronganminh/savestream-video-downloader.git /tmp/target

          cd /tmp/target
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/savestream-downloader-src/. .

          git config user.name "savestream-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: support TikTok photo carousels"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
