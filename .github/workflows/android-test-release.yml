name: Android Test APK Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-test-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build-release-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Create temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/repcoach-test.jks"
          keytool -genkeypair -v \
            -keystore "${KEYSTORE}" \
            -storepass "repcoach-test-2026" \
            -keypass "repcoach-test-2026" \
            -alias "repcoach-test" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RepCoach AI Test,O=RepCoach,C=VN"

          cat > android/key.properties <<EOF
          storePassword=repcoach-test-2026
          keyPassword=repcoach-test-2026
          keyAlias=repcoach-test
          storeFile=${KEYSTORE}
          EOF

      - name: Build store-flavor release APK
        run: >
          flutter build apk
          --release
          --flavor store
          --dart-define=AI_BASE_URL=https://repcoach-ai.duckdns.org

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-store-release.apk"
          test -f "${SOURCE}"

          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')"
          ASSET="RepCoach-AI-Android-Test-${VERSION}.apk"
          cp "${SOURCE}" "${RUNNER_TEMP}/${ASSET}"
          sha256sum "${RUNNER_TEMP}/${ASSET}" > "${RUNNER_TEMP}/${ASSET}.sha256"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "apk=${RUNNER_TEMP}/${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RUNNER_TEMP}/${ASSET}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${{ steps.package.outputs.apk }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: repcoach-android-test-apk
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-test-v${{ steps.package.outputs.version }}-r${GITHUB_RUN_NUMBER}"
          NOTES="${RUNNER_TEMP}/release-notes.md"

          cat > "${NOTES}" <<'EOF'
          ## RepCoach AI Android test APK

          This is the **store flavor** built in Flutter **release mode** and connected to:

          `https://repcoach-ai.duckdns.org`

          It is signed with a **temporary test key generated by GitHub Actions** so it can be installed for hands-on testing. It is **not** the future Google Play signing key.

          Important: a later test APK may use a different temporary key. If Android refuses to install it as an update, uninstall the previous test build first, then install the new APK.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "${{ steps.package.outputs.apk }}" \
              "${{ steps.package.outputs.sha }}" \
              --clobber
          else
            gh release create "${TAG}" \
              "${{ steps.package.outputs.apk }}" \
              "${{ steps.package.outputs.sha }}" \
              --target "${GITHUB_SHA}" \
              --title "RepCoach AI Android Test v${{ steps.package.outputs.version }}" \
              --notes-file "${NOTES}" \
              --prerelease
          fi
