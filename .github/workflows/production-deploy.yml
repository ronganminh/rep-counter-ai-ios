name: RepCoach B7 Production Deploy

on:
  push:
    branches:
      - feature/backend-b7-production
    paths:
      - ".github/workflows/production-deploy.yml"
      - "rep-counter-ai-main/backend/deploy/b7_apply.sh"
      - "rep-counter-ai-main/backend/deploy/b7_rollback.sh"
      - "rep-counter-ai-main/backend/deploy/B7_DEPLOY_APPROVED"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repcoach-b7-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Guarded production deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check explicit deploy approval
        id: gate
        shell: bash
        run: |
          marker="rep-counter-ai-main/backend/deploy/B7_DEPLOY_APPROVED"
          if [[ -f "$marker" ]] && grep -qx 'DEPLOY_B7_2026_10_01' "$marker"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "B7 deploy marker accepted."
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "B7 deploy marker absent; no production changes will be made."
          fi

      - name: Explain locked state
        if: ${{ steps.gate.outputs.approved != 'true' }}
        run: echo "Production deploy is locked until the reviewed approval marker is committed."

      - name: Require SSH secret
        if: ${{ steps.gate.outputs.approved == 'true' }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          if [[ -z "$VPS_SSH_KEY" ]]; then
            echo "Missing repository secret VPS_SSH_KEY." >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/repcoach_b7"
          chmod 0600 "$HOME/.ssh/repcoach_b7"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          14.225.207.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG3oPFCAMe0W1WRqT5OjOHZo8SKDe5tFPeW9VQOYVmzF
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Preflight VPS and paid-mode configuration
        if: ${{ steps.gate.outputs.approved == 'true' }}
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7"             -o IdentitiesOnly=yes             -o BatchMode=yes             -o StrictHostKeyChecking=yes             nduythanh@14.225.207.90 '
              set -eu
              app=/home/nduythanh/apps/repcoach-backend
              test -d "$app"
              test -f "$app/.env"
              test -w "$app"
              grep -qx "AI_PROVIDER=gemini" "$app/.env"
              grep -q "^GEMINI_API_KEY=." "$app/.env"
              grep -qx "GEMINI_SERVICE_MODE=billing_enabled" "$app/.env"
              grep -qx "BIND_HOST=127.0.0.1" "$app/.env"
              sudo -n true
              echo PREFLIGHT_PASS
            '

      - name: Package reviewed backend files
        if: ${{ steps.gate.outputs.approved == 'true' }}
        shell: bash
        run: |
          tar -C rep-counter-ai-main/backend -czf /tmp/repcoach-b7.tgz             server.py             ai_provider.py             static/privacy-policy.html             deploy/repcoach-backend.service             deploy/repcoach-ai.nginx             deploy/repcoach-rate-limit.conf             deploy/repcoach-ai.logrotate             deploy/b7_apply.sh             deploy/b7_rollback.sh

      - name: Upload release package
        if: ${{ steps.gate.outputs.approved == 'true' }}
        shell: bash
        run: |
          scp -i "$HOME/.ssh/repcoach_b7"             -o IdentitiesOnly=yes             -o BatchMode=yes             -o StrictHostKeyChecking=yes             /tmp/repcoach-b7.tgz             nduythanh@14.225.207.90:/tmp/repcoach-b7.tgz

      - name: Apply release transactionally
        if: ${{ steps.gate.outputs.approved == 'true' }}
        id: apply
        shell: bash
        run: |
          output="$(
            ssh -i "$HOME/.ssh/repcoach_b7"               -o IdentitiesOnly=yes               -o BatchMode=yes               -o StrictHostKeyChecking=yes               nduythanh@14.225.207.90 '
                set -eu
                stage="/tmp/repcoach-b7-$(date -u +%Y%m%dT%H%M%SZ)"
                rm -rf "$stage"
                mkdir -p "$stage"
                tar -xzf /tmp/repcoach-b7.tgz -C "$stage"
                chmod 0755 "$stage/deploy/b7_apply.sh" "$stage/deploy/b7_rollback.sh"
                "$stage/deploy/b7_apply.sh" "$stage"
              '
          )"
          printf '%s\n' "$output"
          backup="$(printf '%s\n' "$output" | sed -n 's/^BACKUP_PATH=//p' | tail -n1)"
          if [[ -z "$backup" ]]; then
            echo "Apply script did not return a backup path." >&2
            exit 1
          fi
          echo "backup=$backup" >> "$GITHUB_OUTPUT"

      - name: Run public production smoke
        if: ${{ steps.gate.outputs.approved == 'true' }}
        id: smoke
        working-directory: rep-counter-ai-main/backend
        shell: bash
        run: |
          set -o pipefail
          python3 tools/production_smoke.py | tee /tmp/repcoach-production-smoke.log
          request_id="$(sed -n 's/.*feedback_request_id=\([0-9a-f]\{32\}\).*/\1/p' /tmp/repcoach-production-smoke.log | tail -n1)"
          if [[ -z "$request_id" ]]; then
            echo "Smoke passed without a feedback request ID." >&2
            exit 1
          fi
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Verify privacy-safe production logs
        if: ${{ steps.gate.outputs.approved == 'true' }}
        env:
          REQUEST_ID: ${{ steps.smoke.outputs.request_id }}
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7"             -o IdentitiesOnly=yes             -o BatchMode=yes             -o StrictHostKeyChecking=yes             nduythanh@14.225.207.90 "
              set -eu
              rid='$REQUEST_ID'
              test -n \"$rid\"
              sudo grep -Fq \"request_id=$rid\" /var/log/nginx/repcoach-ai.access.log
              sudo journalctl -u repcoach-backend --since '-15 min' --no-pager | grep -Fq \"\\\"request_id\\\":\\\"$rid\\\"\"
              if sudo journalctl -u repcoach-backend --since '-15 min' --no-pager | grep -F \"$rid\" | grep -E 'consent_version|GEMINI_API_KEY|x-goog-api-key|quality_score|\\\"reps\\\"|\\\"sets\\\"|\\\"exercise\\\"' >/dev/null; then
                echo 'Sensitive workout/provider content appeared in the correlated backend log line.' >&2
                exit 1
              fi
              echo SAFE_LOG_PASS
            "

      - name: Roll back if post-deploy checks fail
        if: ${{ failure() && steps.gate.outputs.approved == 'true' && steps.apply.outputs.backup != '' }}
        env:
          BACKUP: ${{ steps.apply.outputs.backup }}
        shell: bash
        run: |
          echo "Post-deploy validation failed; rolling back."
          ssh -i "$HOME/.ssh/repcoach_b7"             -o IdentitiesOnly=yes             -o BatchMode=yes             -o StrictHostKeyChecking=yes             nduythanh@14.225.207.90 "
              set -eu
              stage=$(ls -dt /tmp/repcoach-b7-* 2>/dev/null | head -n1)
              test -n \"$stage\"
              chmod 0755 \"$stage/deploy/b7_rollback.sh\"
              \"$stage/deploy/b7_rollback.sh\" '$BACKUP'
            "

      - name: Clean runner SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/repcoach_b7"
