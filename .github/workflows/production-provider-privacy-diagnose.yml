name: RepCoach B7 Provider and Privacy Diagnose

on:
  push:
    branches:
      - feature/backend-b7-production
    paths:
      - ".github/workflows/production-provider-privacy-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          test -n "$VPS_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/repcoach_b7"
          chmod 0600 "$HOME/.ssh/repcoach_b7"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          14.225.207.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG3oPFCAMe0W1WRqT5OjOHZo8SKDe5tFPeW9VQOYVmzF
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Inspect privacy path and nginx config
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 '
              set +e
              app=/home/nduythanh/apps/repcoach-backend
              echo "=== PRIVACY PATH ==="
              namei -l "$app/static/privacy-policy.html" 2>&1 || true
              ls -ld "$app" "$app/static" 2>&1 || true
              ls -l "$app/static/privacy-policy.html" 2>&1 || true
              echo "=== NGINX SITE ==="
              sed -n "1,260p" /etc/nginx/sites-available/repcoach-ai 2>&1 || true
              echo "=== RATE LIMIT CONF ==="
              sed -n "1,200p" /etc/nginx/conf.d/repcoach-rate-limit.conf 2>&1 || true
              echo "=== LOCAL NGINX PRIVACY ==="
              curl -kisS --max-time 5 -H "Host: repcoach-ai.duckdns.org" https://127.0.0.1/privacy-policy.html 2>&1 | head -n 30 || true
            '

      - name: Probe Groq response shape with synthetic data only
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 '
              set -e
              app=/home/nduythanh/apps/repcoach-backend
              python3 - <<"PY"
import json, os, urllib.request, urllib.error
from pathlib import Path

env = {}
for raw in Path("/home/nduythanh/apps/repcoach-backend/.env").read_text().splitlines():
    raw = raw.strip()
    if not raw or raw.startswith("#") or "=" not in raw:
        continue
    k, v = raw.split("=", 1)
    env[k] = v

key = env.get("GROQ_API_KEY", "")
model = env.get("GROQ_MODEL", "openai/gpt-oss-20b")
assert key, "missing GROQ_API_KEY"

payload = {
    "model": model,
    "messages": [
        {"role": "system", "content": "Return two short English sentences of general workout feedback. No medical advice."},
        {"role": "user", "content": json.dumps({
            "exercise": "push_up",
            "duration_seconds": 120,
            "reps": 20,
            "sets": 2,
            "quality_score": 88,
            "has_enough_data": True
        })}
    ],
    "temperature": 0.4,
    "max_tokens": 220,
}
req = urllib.request.Request(
    "https://api.groq.com/openai/v1/chat/completions",
    data=json.dumps(payload).encode(),
    headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
    method="POST",
)
try:
    with urllib.request.urlopen(req, timeout=20) as resp:
        raw = resp.read()
        print("GROQ_STATUS=", resp.status, sep="")
except urllib.error.HTTPError as e:
    raw = e.read()
    print("GROQ_STATUS=", e.code, sep="")

print("RAW_BYTES=", len(raw), sep="")
try:
    data = json.loads(raw.decode())
except Exception as e:
    print("JSON_PARSE=FAIL", type(e).__name__)
    raise SystemExit(0)

print("TOP_KEYS=", sorted(data.keys()), sep="")
choices = data.get("choices")
print("CHOICES_TYPE=", type(choices).__name__, sep="")
print("CHOICES_LEN=", len(choices) if isinstance(choices, list) else -1, sep="")
if isinstance(choices, list) and choices:
    choice = choices[0]
    print("CHOICE_KEYS=", sorted(choice.keys()) if isinstance(choice, dict) else type(choice).__name__, sep="")
    if isinstance(choice, dict):
        print("FINISH_REASON=", choice.get("finish_reason"), sep="")
        msg = choice.get("message")
        print("MESSAGE_TYPE=", type(msg).__name__, sep="")
        if isinstance(msg, dict):
            print("MESSAGE_KEYS=", sorted(msg.keys()), sep="")
            content = msg.get("content")
            reasoning = msg.get("reasoning")
            print("CONTENT_TYPE=", type(content).__name__, sep="")
            print("CONTENT_LEN=", len(content) if isinstance(content, str) else -1, sep="")
            print("REASONING_TYPE=", type(reasoning).__name__, sep="")
            print("REASONING_LEN=", len(reasoning) if isinstance(reasoning, str) else -1, sep="")
err = data.get("error")
if isinstance(err, dict):
    print("ERROR_TYPE=", err.get("type"), sep="")
    print("ERROR_CODE=", err.get("code"), sep="")
PY
            '

      - name: Clean runner SSH material
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/repcoach_b7"
