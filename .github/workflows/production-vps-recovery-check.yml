name: RepCoach B7 VPS Recovery Check

on:
  push:
    branches:
      - feature/backend-b7-production
    paths:
      - ".github/workflows/production-vps-recovery-check.yml"
      - "rep-counter-ai-main/backend/tools/groq_shape_diagnose.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          test -n "$VPS_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/repcoach_b7"
          chmod 0600 "$HOME/.ssh/repcoach_b7"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          14.225.207.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG3oPFCAMe0W1WRqT5OjOHZo8SKDe5tFPeW9VQOYVmzF
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Inspect VPS without sudo
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 '
              set +e
              app=/home/nduythanh/apps/repcoach-backend
              echo "SSH_AUTH=PASS"
              echo "SERVICE_ACTIVE=$(systemctl is-active repcoach-backend 2>/dev/null)"
              systemctl show repcoach-backend -p ActiveState -p SubState -p ExecMainStatus --no-pager 2>/dev/null || true
              printf "LOCAL_HEALTH="
              curl -fsS --max-time 5 http://127.0.0.1:8787/health 2>/dev/null || echo "UNAVAILABLE"
              echo
              grep -E "^(AI_PROVIDER|GROQ_MODEL|BIND_HOST)=" "$app/.env" 2>/dev/null || true
              if grep -q "^GROQ_API_KEY=." "$app/.env" 2>/dev/null; then
                echo "GROQ_API_KEY=PRESENT"
              else
                echo "GROQ_API_KEY=MISSING"
              fi
              echo "REMOTE_APP_HASHES"
              sha256sum "$app/server.py" "$app/ai_provider.py" 2>/dev/null || true
              ls -l "$app/server.py" "$app/ai_provider.py" 2>/dev/null || true
            '

      - name: Inspect privacy permissions and Nginx site
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 '
              set +e
              app=/home/nduythanh/apps/repcoach-backend
              echo "PRIVACY_NAMEI"
              namei -l "$app/static/privacy-policy.html" 2>&1 || true
              echo "PRIVACY_LS"
              ls -ld "$app" "$app/static" 2>&1 || true
              ls -l "$app/static/privacy-policy.html" 2>&1 || true
              echo "NGINX_SITE"
              sed -n "1,260p" /etc/nginx/sites-available/repcoach-ai 2>&1 || true
            '

      - name: Upload Groq diagnostic
        shell: bash
        run: |
          scp -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            rep-counter-ai-main/backend/tools/groq_shape_diagnose.py \
            nduythanh@14.225.207.90:/tmp/groq_shape_diagnose.py

      - name: Run Groq synthetic response-shape diagnostic
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 \
            'python3 /tmp/groq_shape_diagnose.py; rm -f /tmp/groq_shape_diagnose.py'

      - name: Show reviewed app hashes
        shell: bash
        run: |
          echo "REVIEWED_APP_HASHES"
          sha256sum \
            rep-counter-ai-main/backend/server.py \
            rep-counter-ai-main/backend/ai_provider.py

      - name: Probe public health
        shell: bash
        run: |
          printf 'PUBLIC_HEALTH='
          curl -fsS --max-time 10 https://repcoach-ai.duckdns.org/health || echo 'UNAVAILABLE'

      - name: Clean runner SSH material
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/repcoach_b7"
