name: Verify source import

on:
  push:
    paths:
      - .github/workflows/verify-source-import-20260928.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATUS_URL: https://filebin.net/ba8c35f091e74db6a2c84f39d0571e6c/rep-counter-import-status.txt

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify imported project
        id: verify
        shell: bash
        run: |
          set +e
          app=rep-counter-ai-main/rep_counter_app
          errors=()

          [[ -f "$app/pubspec.yaml" ]] || errors+=("missing pubspec.yaml")
          [[ -f "$app/lib/main.dart" ]] || errors+=("missing lib/main.dart")
          [[ -f "$app/lib/core/i18n/locale_controller.dart" ]] || errors+=("missing locale controller")
          [[ -f "$app/ios/Runner/Info.plist" ]] || errors+=("missing iOS Info.plist")
          [[ -f "$app/ios/Runner.xcodeproj/project.pbxproj" ]] || errors+=("missing Xcode project")
          [[ -f .github/workflows/ios-ci.yml ]] || errors+=("missing ios-ci.yml")
          [[ ! -e .probe ]] || errors+=("temporary .probe directory remains")
          [[ ! -e .bootstrap ]] || errors+=("temporary .bootstrap directory remains")
          [[ ! -e .bootstrap-v2 ]] || errors+=("temporary .bootstrap-v2 directory remains")
          [[ ! -e .bootstrap-v3 ]] || errors+=("temporary .bootstrap-v3 directory remains")
          [[ ! -e .bootstrap-v4 ]] || errors+=("temporary .bootstrap-v4 directory remains")

          if [[ -f "$app/pubspec.yaml" ]] && grep -q 'import_probe_should_never_be_created' "$app/pubspec.yaml"; then
            errors+=("pubspec sentinel content remains")
          fi

          dart_count=0
          if [[ -d "$app/lib" ]]; then
            dart_count="$(find "$app/lib" "$app/test" -type f -name '*.dart' 2>/dev/null | wc -l | tr -d ' ')"
            (( dart_count >= 20 )) || errors+=("Dart source count is only $dart_count")
          fi

          bundle_ok=no
          if [[ -f "$app/ios/Runner.xcodeproj/project.pbxproj" ]] \
            && grep -q 'com.ronganminh.repCounterApp' "$app/ios/Runner.xcodeproj/project.pbxproj"; then
            bundle_ok=yes
          else
            errors+=("expected iOS bundle identifier is missing")
          fi

          if (( ${#errors[@]} == 0 )); then
            status=OK
          else
            status=FAIL
          fi

          {
            echo "status=$status"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "dart_files=$dart_count"
            echo "bundle_id_ok=$bundle_ok"
            if (( ${#errors[@]} > 0 )); then
              printf 'error=%s\n' "${errors[@]}"
            fi
          } | tee /tmp/import-status.txt

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H 'Content-Type: text/plain' --data-binary @/tmp/import-status.txt \
            "$STATUS_URL" >/dev/null

          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ "$status" == OK ]]

      - name: Remove temporary verifier
        if: steps.verify.outputs.status == 'OK'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-source-import-20260928.yml
          git commit -m 'chore: remove temporary import verifier'
          git push
