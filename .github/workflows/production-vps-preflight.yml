name: RepCoach B7 VPS Preflight

on:
  push:
    branches:
      - feature/backend-b7-production
    paths:
      - ".github/workflows/production-vps-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only VPS preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          if [[ -z "$VPS_SSH_KEY" ]]; then
            echo "Missing repository secret VPS_SSH_KEY." >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/repcoach_b7"
          chmod 0600 "$HOME/.ssh/repcoach_b7"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          14.225.207.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG3oPFCAMe0W1WRqT5OjOHZo8SKDe5tFPeW9VQOYVmzF
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Inspect production configuration without printing secrets
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/repcoach_b7" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            nduythanh@14.225.207.90 '
              set -u
              app=/home/nduythanh/apps/repcoach-backend
              echo "SSH_AUTH=PASS"

              if test -d "$app"; then echo "APP_DIR=PASS"; else echo "APP_DIR=FAIL"; fi
              if test -f "$app/.env"; then echo "ENV_FILE=PASS"; else echo "ENV_FILE=FAIL"; exit 0; fi

              if grep -qx "AI_PROVIDER=groq" "$app/.env"; then
                echo "AI_PROVIDER_GROQ=YES"
              else
                echo "AI_PROVIDER_GROQ=NO"
              fi

              if grep -q "^GROQ_API_KEY=." "$app/.env"; then
                echo "GROQ_API_KEY=PRESENT"
              else
                echo "GROQ_API_KEY=MISSING"
              fi

              if grep -qx "GROQ_MODEL=openai/gpt-oss-20b" "$app/.env"; then
                echo "GROQ_MODEL_EXPECTED=YES"
              else
                echo "GROQ_MODEL_EXPECTED=NO"
              fi

              if grep -qx "BIND_HOST=127.0.0.1" "$app/.env"; then
                echo "BIND_HOST_EXPECTED=YES"
              else
                echo "BIND_HOST_EXPECTED=NO"
              fi

              if sudo -n true 2>/dev/null; then
                echo "SUDO_NOPASSWD=YES"
              else
                echo "SUDO_NOPASSWD=NO"
              fi

              if systemctl is-active --quiet repcoach-backend 2>/dev/null; then
                echo "SERVICE_ACTIVE=YES"
              else
                echo "SERVICE_ACTIVE=NO"
              fi
            '

      - name: Clean runner SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/repcoach_b7"
