name: Recover Rep Counter AI source import

on:
  push:
    paths:
      - .github/workflows/recover-source-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-rep-counter-source
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out destination
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover and validate source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source-candidate /tmp/source-normalized /tmp/source-urls.txt

          cat > /tmp/source-urls.txt <<'EOF'
          https://github.com/Juliolayme/rep-counter-ai-ios.git
          https://github.com/Juliolayme/rep-counter-ai.git
          EOF

          curl -fsSL 'https://api.github.com/users/Juliolayme/repos?per_page=100&type=owner' \
            | python3 -c 'import json,sys; print("\n".join(r["clone_url"] for r in json.load(sys.stdin) if "rep" in r["name"].lower() or "counter" in r["name"].lower()))' \
            >> /tmp/source-urls.txt || true

          awk 'NF && !seen[$0]++' /tmp/source-urls.txt > /tmp/source-urls-dedup.txt

          selected_url=''
          selected_app=''
          while IFS= read -r url; do
            rm -rf /tmp/source-candidate
            if ! git clone --depth 1 "$url" /tmp/source-candidate; then
              continue
            fi

            while IFS= read -r pubspec; do
              app_dir="$(dirname "$pubspec")"
              if [[ -f "$app_dir/lib/main.dart" ]] \
                && [[ -f "$app_dir/lib/core/i18n/locale_controller.dart" ]] \
                && [[ -f "$app_dir/ios/Runner/Info.plist" ]] \
                && [[ -f "$app_dir/ios/Runner.xcodeproj/project.pbxproj" ]]; then
                selected_url="$url"
                selected_app="$app_dir"
                break 2
              fi
            done < <(find /tmp/source-candidate -maxdepth 5 -type f -name pubspec.yaml | sort)
          done < /tmp/source-urls-dedup.txt

          if [[ -z "$selected_url" || -z "$selected_app" ]]; then
            echo 'Unable to locate the expected Rep Counter Flutter/iOS source in accessible project repositories.' >&2
            exit 1
          fi

          mkdir -p /tmp/source-normalized/rep-counter-ai-main

          case "$selected_app" in
            /tmp/source-candidate/rep-counter-ai-main/rep_counter_app)
              rsync -a --exclude=.git /tmp/source-candidate/ /tmp/source-normalized/
              ;;
            /tmp/source-candidate/rep_counter_app)
              rsync -a --exclude=.git --exclude=rep_counter_app /tmp/source-candidate/ /tmp/source-normalized/
              rsync -a /tmp/source-candidate/rep_counter_app/ /tmp/source-normalized/rep-counter-ai-main/rep_counter_app/
              ;;
            /tmp/source-candidate)
              mkdir -p /tmp/source-normalized/rep-counter-ai-main/rep_counter_app
              rsync -a --exclude=.git /tmp/source-candidate/ /tmp/source-normalized/rep-counter-ai-main/rep_counter_app/
              ;;
            *)
              mkdir -p /tmp/source-normalized/rep-counter-ai-main/rep_counter_app
              rsync -a "$selected_app"/ /tmp/source-normalized/rep-counter-ai-main/rep_counter_app/
              ;;
          esac

          app='/tmp/source-normalized/rep-counter-ai-main/rep_counter_app'
          test -f "$app/pubspec.yaml"
          test -f "$app/lib/main.dart"
          test -f "$app/lib/core/i18n/locale_controller.dart"
          test -f "$app/ios/Runner/Info.plist"
          test -f "$app/ios/Runner.xcodeproj/project.pbxproj"

          echo "Selected source: $selected_url"
          echo "url=$selected_url" >> "$GITHUB_OUTPUT"

      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a /tmp/source-normalized/ ./

          app='rep-counter-ai-main/rep_counter_app'
          test -f "$app/pubspec.yaml"
          test -f "$app/lib/main.dart"
          test -f "$app/lib/core/i18n/locale_controller.dart"
          test -f "$app/ios/Runner/Info.plist"

          if ! grep -q 'com.ronganminh.repCounterApp' "$app/ios/Runner.xcodeproj/project.pbxproj"; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('rep-counter-ai-main/rep_counter_app/ios/Runner.xcodeproj/project.pbxproj')
          text = path.read_text()
          import re
          text = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.ronganminh.repCounterApp;', text)
          path.write_text(text)
          PY
          fi

      - name: Install final CI workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cat > .github/workflows/ios-ci.yml <<'YAML'
          name: Flutter iOS CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ios-ci-${{ github.ref }}
            cancel-in-progress: true

          defaults:
            run:
              working-directory: rep-counter-ai-main/rep_counter_app

          jobs:
            quality:
              name: Analyze and test
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2.23.0
                  with:
                    flutter-version: 3.47.5
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter analyze --fatal-infos
                - run: flutter test --coverage
                - uses: actions/upload-artifact@v7
                  if: always()
                  with:
                    name: flutter-coverage
                    path: rep-counter-ai-main/rep_counter_app/coverage
                    if-no-files-found: ignore
                    retention-days: 14

            ios-build-smoke:
              name: iOS build and simulator smoke test
              runs-on: macos-26
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v7
                - uses: subosito/flutter-action@v2.23.0
                  with:
                    flutter-version: 3.47.5
                    channel: stable
                    cache: true
                - run: flutter pub get
                - name: Install CocoaPods dependencies
                  run: |
                    cd ios
                    pod install --repo-update
                - name: Build simulator application
                  run: flutter build ios --simulator --debug --no-codesign
                - name: Boot simulator and launch application
                  shell: bash
                  run: |
                    set -euo pipefail
                    device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; preferred=("iPhone 17 Pro","iPhone 17","iPhone 16 Pro","iPhone 16"); print(next(x["udid"] for n in preferred for values in d.values() for x in values if x["name"]==n))')"
                    xcrun simctl boot "$device" || true
                    open -a Simulator
                    xcrun simctl bootstatus "$device" -b
                    app='build/ios/iphonesimulator/Runner.app'
                    xcrun simctl install "$device" "$app"
                    xcrun simctl launch --console-pty "$device" com.ronganminh.repCounterApp > runner.log 2>&1 &
                    pid=$!
                    sleep 12
                    xcrun simctl io "$device" screenshot ios-launch.png
                    kill "$pid" 2>/dev/null || true
                - name: Build unsigned device release
                  run: flutter build ios --release --no-codesign
                - uses: actions/upload-artifact@v7
                  if: always()
                  with:
                    name: ios-smoke-artifacts
                    path: |
                      rep-counter-ai-main/rep_counter_app/ios-launch.png
                      rep-counter-ai-main/rep_counter_app/runner.log
                      rep-counter-ai-main/rep_counter_app/build/ios/iphoneos/Runner.app
                    if-no-files-found: warn
                    retention-days: 14
          YAML

      - name: Publish a clean main branch
        shell: bash
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="clean-main-${GITHUB_RUN_ID}"
          git checkout --orphan "$branch"
          git reset
          git add -A
          git commit -m 'feat: import Rep Counter AI iOS source and CI'
          git push --force origin HEAD:main
          echo "Imported source from $SOURCE_URL"
