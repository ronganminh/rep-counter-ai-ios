name: Inspect CI evidence lite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ci-evidence.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "36523174267"
    steps:
      - name: Download source artifact on GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source lite
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ios-video-test-evidence \
            --dir source
          find source -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Collect lightweight evidence
        run: |
          find source -type f \( \
            -name 'ios-video-result.png' -o \
            -name 'ci-video-result.txt' -o \
            -name 'runner.stdout.log' -o \
            -name 'runner.stderr.log' -o \
            -name 'runner-system.log' -o \
            -name 'runner-binary-arch.txt' -o \
            -name 'generated-xcconfig-arch.txt' \
          \) -exec cp {} lite/ \;

          video="$(find source -type f -name 'ios-video-replay.mp4' | head -1)"
          if [[ -n "$video" ]]; then
            ffmpeg -hide_banner -loglevel error -y \
              -i "$video" \
              -vf "fps=1/60,scale=240:-1,tile=5x4:padding=4:margin=4" \
              -frames:v 1 lite/contact-sheet.jpg || true

            ffmpeg -hide_banner -loglevel error -y \
              -ss 00:12:00 -i "$video" -t 00:01:00 \
              -vf "scale=360:-2" -an -c:v libx264 -preset veryfast -crf 30 \
              lite/final-minute-preview.mp4 || true
          fi

          ls -lh lite

      - name: Upload lightweight evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-video-test-evidence-lite
          path: lite/
          retention-days: 7
          compression-level: 6
