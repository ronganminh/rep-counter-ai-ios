name: RepCoach Android Replay

# Replays a fixture push-up video through the PRODUCTION workout on a real
# Android emulator and reports the engine rep count, mirroring the iOS replay.
# Android uses ML Kit's Android pose backend, so its counts can differ from
# iOS; this job is INFORMATIONAL for now (prints the count + uploads evidence)
# and does not fail on a rep baseline until an Android baseline is agreed.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "rep-counter-ai-main/rep_counter_app/**"
      - ".github/workflows/android-replay.yml"

permissions:
  contents: read

concurrency:
  group: repcoach-android-replay-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  android-replay:
    name: Android replay (${{ matrix.fixture_key }})
    runs-on: ubuntu-latest
    # The rest fixture replays in ~2 h 10 m on a typical runner but has
    # taken over 2 h 38 m on a slow one; the replay script waits up to
    # 210 min (REPLAY_WAIT_SECONDS) and the job keeps headroom for setup.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture_key: pushup-1
            asset: "pushup-test.mp4"
            video_id: "13TwRvZQAXsm0-Gl7d_GmPV1T75B8QFf8"
          - fixture_key: pushup-rest-regression
            asset: "pushup-rest-regression.mp4"
            video_id: "1LGVdSlam1Rqe7nwOuWupCMLmSv2dIsAW"
          # pushup-2 (pushup-test-2.mp4, ~30 min / 3.4 GB) is too slow to replay
          # on the software emulator (exceeds the job timeout); re-add with a
          # much larger timeout if full parity with iOS is required.
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_VIDEO_ASSET: ${{ matrix.asset }}
      TEST_VIDEO_KEY: ${{ matrix.fixture_key }}
      TEST_VIDEO_ID: ${{ matrix.video_id }}
      PKG: com.ronganminh.repcoach
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enable KVM (hardware acceleration)
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Reuse or download CI fixture video once
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/repcoach-ci-fixtures"
          fixture="$fixture_dir/$TEST_VIDEO_ASSET"
          parts_dir="$fixture_dir/parts"
          mkdir -p "$fixture_dir" "$parts_dir"

          if gh release download ci-fixtures --repo "$GITHUB_REPOSITORY" \
              --pattern "$TEST_VIDEO_ASSET" --dir "$fixture_dir" >/dev/null 2>&1; then
            echo "source=github-release"
          elif gh release download ci-fixtures --repo "$GITHUB_REPOSITORY" \
              --pattern "$TEST_VIDEO_ASSET.part.*" --dir "$parts_dir" >/dev/null 2>&1; then
            cat "$parts_dir"/"$TEST_VIDEO_ASSET".part.* > "$fixture"
            echo "source=github-release-chunks"
          else
            echo "Downloading fixture from Google Drive once."
            venv="$RUNNER_TEMP/gdown"; python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet gdown
            "$venv/bin/gdown" "https://drive.google.com/uc?id=$TEST_VIDEO_ID" -O "$fixture"
          fi
          test -s "$fixture"
          ls -lh "$fixture"
          echo "fixture_path=$fixture" >> "$GITHUB_OUTPUT"

      - name: Build debug APK (CI video mode)
        run: |
          flutter build apk --debug --flavor store \
            --dart-define=REPCOACH_CI_VIDEO_ASSET="$TEST_VIDEO_ASSET"
          ls -lh build/app/outputs/flutter-apk/app-store-debug.apk

      - name: Replay on emulator and capture rep count
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.fixture_path }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: rep-counter-ai-main/rep_counter_app
          script: bash tool/ci_android_replay.sh

      - name: Verify reps counted during exercise, not during rest
        if: matrix.fixture_key == 'pushup-rest-regression'
        run: |
          python3 tool/check_video_rest_timeline.py \
            --timeline "$GITHUB_WORKSPACE/ci-artifacts/ci-video-timeline.txt" \
            --result "$GITHUB_WORKSPACE/ci-artifacts/ci-video-result.txt" \
            --manifest test/fixtures/video_ground_truth.json \
            --fixture pushup-rest-regression

      - name: Report rep count (informational)
        if: always()
        shell: bash
        run: |
          echo "## Android replay — ${TEST_VIDEO_KEY}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$GITHUB_WORKSPACE/ci-artifacts/ci-video-result.txt" ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_WORKSPACE/ci-artifacts/ci-video-result.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No result captured._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Android replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-replay-evidence-${{ matrix.fixture_key }}
          path: |
            ci-artifacts/ci-video-result.txt
            ci-artifacts/ci-video-timeline.txt
            ci-artifacts/android-logcat.txt
            ci-artifacts/android-video-result.png
          if-no-files-found: warn
          retention-days: 30
