name: RepCoach CI

on:
  push:
    branches: [main, master]
    paths:
      - "rep-counter-ai-main/rep_counter_app/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "rep-counter-ai-main/rep_counter_app/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repcoach-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  TEST_VIDEO_ID: "13TwRvZQAXsm0-Gl7d_GmPV1T75B8QFf8"
  TEST_VIDEO_ASSET: "pushup-test.mp4"

jobs:
  quality:
    name: Analyze and Flutter tests
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: rep-counter-ai-main/rep_counter_app/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  ios-build-video-test:
    name: Apple Silicon iOS build + video replay
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Apple Silicon and tool versions
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Resolve dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter precache --ios
          flutter pub get

      - name: Rebuild CocoaPods integration
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods
          pod install --repo-update
          cd ..
          test -f ios/Pods/Target\ Support\ Files/Pods-Runner/Pods-Runner.debug.xcconfig

      - name: Reuse or download CI fixture video once
        id: fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="$RUNNER_TEMP/repcoach-ci-fixtures"
          fixture="$fixture_dir/$TEST_VIDEO_ASSET"
          mkdir -p "$fixture_dir" "$GITHUB_WORKSPACE/ci-artifacts"

          if gh release download ci-fixtures               --repo "$GITHUB_REPOSITORY"               --pattern "$TEST_VIDEO_ASSET"               --dir "$fixture_dir" >/dev/null 2>&1; then
            echo "fixture_source=github-release" | tee -a "$GITHUB_OUTPUT"
          else
            echo "CI fixture is not in GitHub Release yet; downloading Google Drive once."
            gdown_venv="$RUNNER_TEMP/gdown-venv"
            python3 -m venv "$gdown_venv"
            "$gdown_venv/bin/python" -m pip install --quiet --upgrade pip
            "$gdown_venv/bin/python" -m pip install --quiet gdown
            "$gdown_venv/bin/python" -m gdown "https://drive.google.com/uc?id=$TEST_VIDEO_ID" -O "$fixture"

            test -s "$fixture"
            gh release view ci-fixtures --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||               gh release create ci-fixtures                 --repo "$GITHUB_REPOSITORY"                 --title "RepCoach CI fixtures"                 --notes "Private reusable test fixtures used by GitHub Actions."

            gh release upload ci-fixtures               --repo "$GITHUB_REPOSITORY"               "$fixture#$TEST_VIDEO_ASSET"               --clobber

            echo "fixture_source=google-drive-then-github-release" | tee -a "$GITHUB_OUTPUT"
          fi

          test -s "$fixture"
          shasum -a 256 "$fixture" | tee "$GITHUB_WORKSPACE/ci-artifacts/input-video.sha256"
          file "$fixture" | tee "$GITHUB_WORKSPACE/ci-artifacts/input-video.txt"
          ls -lh "$fixture" | tee -a "$GITHUB_WORKSPACE/ci-artifacts/input-video.txt"
          echo "fixture_path=$fixture" >> "$GITHUB_OUTPUT"

      - name: Build debug app for iOS Simulator
        run: |
          chmod +x tool/build_ios.sh
          ./tool/build_ios.sh \
            --simulator \
            --debug \
            --no-pub \
            --dart-define=REPCOACH_CI_VIDEO_ASSET="$TEST_VIDEO_ASSET"

      - name: Replay fixture, record screen, and collect debug logs
        shell: bash
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.fixture_path }}
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/ci-artifacts"
          mkdir -p "$artifact_dir"

          simulator_udid="$(xcrun simctl list devices available -j | jq -r '
            [
              .devices[][]
              | select(.isAvailable == true)
              | select(.name == "iPhone 17 Pro")
            ][0].udid // empty
          ')"

          if [[ -z "$simulator_udid" ]]; then
            simulator_udid="$(xcrun simctl list devices available -j | jq -r '
              [
                .devices[][]
                | select(.isAvailable == true)
                | select(.name | startswith("iPhone"))
              ][0].udid // empty
            ')"
          fi

          if [[ -z "$simulator_udid" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          echo "$simulator_udid" > "$artifact_dir/simulator-udid.txt"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b

          app_path="build/ios/iphonesimulator/Runner.app"
          bundle_id="com.ronganminh.repCounterApp"
          xcrun simctl install "$simulator_udid" "$app_path"

          data_dir="$(xcrun simctl get_app_container "$simulator_udid" "$bundle_id" data)"
          app_video="$data_dir/tmp/$TEST_VIDEO_ASSET"
          result_file="$data_dir/tmp/ci-video-result.txt"
          rm -f "$result_file"
          cp "$FIXTURE_PATH" "$app_video"

          screen_video="$artifact_dir/ios-video-replay.mp4"
          xcrun simctl io "$simulator_udid" recordVideo             --codec=h264             --force             "$screen_video"             >"$artifact_dir/record-video.log" 2>&1 &
          recorder_pid=$!

          cleanup() {
            kill -INT "$recorder_pid" 2>/dev/null || true
            wait "$recorder_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2

          stdout_log="$artifact_dir/runner.stdout.log"
          stderr_log="$artifact_dir/runner.stderr.log"

          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$stdout_log" \
            --stderr="$stderr_log" \
            "$simulator_udid" \
            "$bundle_id"

          result_found=0
          for _ in $(seq 1 360); do
            if [[ -s "$result_file" ]]; then
              cat "$result_file" | tee "$artifact_dir/ci-video-result.txt"

              if grep -q "\[CI_VIDEO_RESULT\]" "$result_file"; then
                result_found=1
                break
              fi

              if grep -q "\[CI_VIDEO_ERROR\]" "$result_file"; then
                exit 1
              fi
            fi

            sleep 5
          done

          xcrun simctl io "$simulator_udid" screenshot "$artifact_dir/ios-video-result.png"

          xcrun simctl spawn "$simulator_udid" log show             --last 20m             --style compact             --predicate 'process == "Runner"'             > "$artifact_dir/runner-system.log" || true

          if [[ "$result_found" != "1" ]]; then
            echo "Timed out waiting for CI video result." | tee "$artifact_dir/ci-video-result.txt"
            exit 1
          fi

          cp "$result_file" "$artifact_dir/ci-video-result.txt"

          cleanup
          trap - EXIT

      - name: Build unsigned iPhone release
        run: ./tool/build_ios.sh --release --no-codesign --no-pub

      - name: Upload iOS video-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-video-test-evidence
          path: |
            ci-artifacts/ios-video-replay.mp4
            ci-artifacts/ios-video-result.png
            ci-artifacts/ci-video-result.txt
            ci-artifacts/runner.stdout.log
            ci-artifacts/runner.stderr.log
            ci-artifacts/runner-system.log
            ci-artifacts/record-video.log
            ci-artifacts/input-video.sha256
            ci-artifacts/input-video.txt
            ci-artifacts/simulator-udid.txt
            rep-counter-ai-main/rep_counter_app/ios/Podfile.lock
            rep-counter-ai-main/rep_counter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 30
