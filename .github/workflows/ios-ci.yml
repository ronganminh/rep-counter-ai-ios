name: RepCoach CI

on:
  push:
    branches: [main, master, feature/vnext-a2-transparent-form-score]
    paths:
      - "rep-counter-ai-main/rep_counter_app/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "rep-counter-ai-main/rep_counter_app/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repcoach-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  quality:
    name: Analyze and Flutter tests
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: rep-counter-ai-main/rep_counter_app/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  ios-build-video-test:
    name: Apple Silicon iOS replay (${{ matrix.fixture_key }})
    needs: quality
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - fixture_key: pushup-1
            video_id: "13TwRvZQAXsm0-Gl7d_GmPV1T75B8QFf8"
            asset: "pushup-test.mp4"
          - fixture_key: pushup-2
            video_id: "1m7rKK5_Mtfe1NaFCXSTVdg_lzywoDWf0"
            asset: "pushup-test-2.mp4"
    runs-on: macos-15
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      REPCOACH_CI_X64_SIM: "1"
      TEST_VIDEO_ID: ${{ matrix.video_id }}
      TEST_VIDEO_ASSET: ${{ matrix.asset }}
      TEST_VIDEO_KEY: ${{ matrix.fixture_key }}
    defaults:
      run:
        working-directory: rep-counter-ai-main/rep_counter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Apple Silicon and tool versions
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version

      - name: Resolve dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter precache --ios
          flutter pub get

      - name: Rebuild CocoaPods integration
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods
          pod install --repo-update
          cd ..
          test -f ios/Pods/Target\ Support\ Files/Pods-Runner/Pods-Runner.debug.xcconfig

      - name: Reuse or download CI fixture video once
        id: fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="$RUNNER_TEMP/repcoach-ci-fixtures"
          fixture="$fixture_dir/$TEST_VIDEO_ASSET"
          mkdir -p "$fixture_dir" "$GITHUB_WORKSPACE/ci-artifacts"
          echo "$TEST_VIDEO_KEY" > "$GITHUB_WORKSPACE/ci-artifacts/fixture-key.txt"

          parts_dir="$fixture_dir/parts"
          mkdir -p "$parts_dir"

          if gh release download ci-fixtures \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$TEST_VIDEO_ASSET" \
              --dir "$fixture_dir" >/dev/null 2>&1; then
            echo "fixture_source=github-release" | tee -a "$GITHUB_OUTPUT"
          elif gh release download ci-fixtures \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$TEST_VIDEO_ASSET.part.*" \
              --dir "$parts_dir" >/dev/null 2>&1; then
            cat "$parts_dir"/"$TEST_VIDEO_ASSET".part.* > "$fixture"
            echo "fixture_source=github-release-chunks" | tee -a "$GITHUB_OUTPUT"
          else
            echo "CI fixture is not in GitHub Release yet; downloading Google Drive once."
            gdown_venv="$RUNNER_TEMP/gdown-venv"
            python3 -m venv "$gdown_venv"
            "$gdown_venv/bin/python" -m pip install --quiet --upgrade pip
            "$gdown_venv/bin/python" -m pip install --quiet gdown
            "$gdown_venv/bin/python" -m gdown \
              "https://drive.google.com/uc?id=$TEST_VIDEO_ID" \
              -O "$fixture"

            test -s "$fixture"
            gh release view ci-fixtures --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create ci-fixtures \
                --repo "$GITHUB_REPOSITORY" \
                --title "RepCoach CI fixtures" \
                --notes "Private reusable test fixtures used by GitHub Actions."

            fixture_bytes="$(stat -f%z "$fixture")"
            if (( fixture_bytes > 1900000000 )); then
              echo "Fixture is $fixture_bytes bytes; caching as <2 GB release chunks."
              rm -rf "$parts_dir"
              mkdir -p "$parts_dir"
              split -b 1800m "$fixture" "$parts_dir/$TEST_VIDEO_ASSET.part."
              for part in "$parts_dir"/"$TEST_VIDEO_ASSET".part.*; do
                gh release upload ci-fixtures \
                  --repo "$GITHUB_REPOSITORY" \
                  "$part" \
                  --clobber
              done
              echo "fixture_source=google-drive-then-github-release-chunks" | tee -a "$GITHUB_OUTPUT"
            else
              gh release upload ci-fixtures \
                --repo "$GITHUB_REPOSITORY" \
                "$fixture" \
                --clobber
              echo "fixture_source=google-drive-then-github-release" | tee -a "$GITHUB_OUTPUT"
            fi
          fi

          test -s "$fixture"
          shasum -a 256 "$fixture" | tee "$GITHUB_WORKSPACE/ci-artifacts/input-video.sha256"
          file "$fixture" | tee "$GITHUB_WORKSPACE/ci-artifacts/input-video.txt"
          ls -lh "$fixture" | tee -a "$GITHUB_WORKSPACE/ci-artifacts/input-video.txt"
          echo "fixture_path=$fixture" >> "$GITHUB_OUTPUT"

      - name: Build debug app for iOS Simulator
        run: |
          chmod +x tool/build_ios.sh
          ./tool/build_ios.sh \
            --simulator \
            --debug \
            --no-pub \
            --dart-define=REPCOACH_CI_VIDEO_ASSET="$TEST_VIDEO_ASSET"

          lipo -info build/ios/iphonesimulator/Runner.app/Runner \
            | tee "$GITHUB_WORKSPACE/ci-artifacts/runner-binary-arch.txt"
          grep -i "EXCLUDED_ARCHS" ios/Flutter/Generated.xcconfig \
            | tee "$GITHUB_WORKSPACE/ci-artifacts/generated-xcconfig-arch.txt" || true

      - name: Replay fixture, record screen, and collect debug logs
        shell: bash
        env:
          FIXTURE_PATH: ${{ steps.fixture.outputs.fixture_path }}
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/ci-artifacts"
          mkdir -p "$artifact_dir"

          simulator_udid="$(xcrun simctl list devices available -j | jq -r '
            [
              .devices
              | to_entries[]
              | select(.key | contains("iOS-18-5"))
              | .value[]
              | select(.isAvailable == true)
              | select(.name == "iPhone 16 Pro")
            ][0].udid // empty
          ')"

          if [[ -z "$simulator_udid" ]]; then
            simulator_udid="$(xcrun simctl list devices available -j | jq -r '
              [
                .devices
                | to_entries[]
                | select(.key | contains("iOS-18-5"))
                | .value[]
                | select(.isAvailable == true)
                | select(.name | startswith("iPhone"))
              ][0].udid // empty
            ')"
          fi

          if [[ -z "$simulator_udid" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          echo "$simulator_udid" > "$artifact_dir/simulator-udid.txt"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b

          app_path="build/ios/iphonesimulator/Runner.app"
          bundle_id="com.ronganminh.repCounterApp"
          xcrun simctl install "$simulator_udid" "$app_path"

          data_dir="$(xcrun simctl get_app_container "$simulator_udid" "$bundle_id" data)"
          app_video="$data_dir/tmp/$TEST_VIDEO_ASSET"
          result_file="$data_dir/tmp/ci-video-result.txt"
          rm -f "$result_file"
          cp "$FIXTURE_PATH" "$app_video"

          screen_video="$artifact_dir/ios-video-replay.mp4"
          xcrun simctl io "$simulator_udid" recordVideo             --codec=h264             --force             "$screen_video"             >"$artifact_dir/record-video.log" 2>&1 &
          recorder_pid=$!

          cleanup() {
            kill -INT "$recorder_pid" 2>/dev/null || true
            wait "$recorder_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 2

          stdout_log="$artifact_dir/runner.stdout.log"
          stderr_log="$artifact_dir/runner.stderr.log"

          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$stdout_log" \
            --stderr="$stderr_log" \
            "$simulator_udid" \
            "$bundle_id"

          result_found=0
          last_status=""
          stalled_checks=0
          for _ in $(seq 1 960); do
            if grep -Eq "F0000|Check failed:|Abort trap|Terminated due to signal" "$stderr_log" 2>/dev/null; then
              cat "$stderr_log"
              echo "[CI_VIDEO_ERROR] native_mlkit_crash" \
                | tee "$artifact_dir/ci-video-result.txt"
              exit 1
            fi

            if [[ -s "$result_file" ]]; then
              current_status="$(cat "$result_file")"
              printf '%s\n' "$current_status" | tee "$artifact_dir/ci-video-result.txt"

              if grep -q "\[CI_VIDEO_RESULT\]" "$result_file"; then
                result_found=1
                break
              fi

              if grep -q "\[CI_VIDEO_ERROR\]" "$result_file"; then
                exit 1
              fi

              if [[ "$current_status" == "$last_status" ]]; then
                stalled_checks=$((stalled_checks + 1))
              else
                last_status="$current_status"
                stalled_checks=0
              fi

              if (( stalled_checks >= 60 )); then
                echo "[CI_VIDEO_ERROR] replay_stalled_for_5_minutes" \
                  | tee "$artifact_dir/ci-video-result.txt"
                exit 1
              fi
            fi

            sleep 5
          done

          xcrun simctl io "$simulator_udid" screenshot "$artifact_dir/ios-video-result.png"

          xcrun simctl spawn "$simulator_udid" log show             --last 20m             --style compact             --predicate 'process == "Runner"'             > "$artifact_dir/runner-system.log" || true

          if [[ "$result_found" != "1" ]]; then
            echo "Timed out waiting for CI video result." | tee "$artifact_dir/ci-video-result.txt"
            exit 1
          fi

          cp "$result_file" "$artifact_dir/ci-video-result.txt"

          cleanup
          trap - EXIT

      - name: Build unsigned iPhone release
        run: ./tool/build_ios.sh --release --no-codesign --no-pub

      - name: Upload iOS video-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-video-test-evidence-${{ matrix.fixture_key }}
          path: |
            ci-artifacts/ios-video-replay.mp4
            ci-artifacts/ios-video-result.png
            ci-artifacts/ci-video-result.txt
            ci-artifacts/runner.stdout.log
            ci-artifacts/runner.stderr.log
            ci-artifacts/runner-system.log
            ci-artifacts/record-video.log
            ci-artifacts/input-video.sha256
            ci-artifacts/input-video.txt
            ci-artifacts/simulator-udid.txt
            ci-artifacts/runner-binary-arch.txt
            ci-artifacts/generated-xcconfig-arch.txt
            ci-artifacts/fixture-key.txt
            rep-counter-ai-main/rep_counter_app/ios/Podfile.lock
            rep-counter-ai-main/rep_counter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 30
