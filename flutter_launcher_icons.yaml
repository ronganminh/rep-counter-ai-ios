# RepCoach AI app icon — Concept 2 "Vòng đếm + khớp".
# Assets are generated by `node tool/app_icon/generate.mjs`.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/ios/AppIcon-1024.png"

  ios: true
  remove_alpha_ios: true
  image_path_ios: "assets/icon/ios/AppIcon-1024.png"
  image_path_ios_dark_transparent: "assets/icon/ios/AppIcon-dark-1024.png"
  image_path_ios_tinted_grayscale: "assets/icon/ios/AppIcon-tinted-1024.png"

  android: "ic_launcher"
  image_path_android: "assets/icon/android/res/mipmap-xxxhdpi/ic_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/android/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icon/android/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/android/ic_launcher_monochrome.png"
